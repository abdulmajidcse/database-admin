name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Currently the SQL lexer, changeset builder and schema differ — none of
      # which need a database. When the engine-backed suite in tests/ is wired
      # into vitest, add the five engines here as `services:` containers and
      # point TEST_*_HOST/TEST_*_PORT at them.
      - run: npm test

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The image is the delivery path, so a Dockerfile that stops building is
      # a broken release even when the source typechecks. Build only — pushing
      # anywhere is out of scope for CI.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
