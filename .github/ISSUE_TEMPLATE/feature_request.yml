name: Feature request
description: Suggest something the tool should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task you are stuck on, rather than the solution you have in mind. It often turns out there is a better fit than the feature first imagined.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Does this apply to a particular engine
      options:
        - All engines
        - PostgreSQL
        - MySQL / MariaDB
        - Redis
        - MongoDB
        - SQLite
    validations:
      required: true

  - type: checkboxes
    id: contributing
    attributes:
      label: Would you be willing to work on it
      options:
        - label: I would be happy to open a pull request for this
