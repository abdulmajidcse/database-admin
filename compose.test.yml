# PLAN §13 — the engines the test suite runs against.
#
# Engines only: there is no app service here, so this file can never collide
# with compose.yml's published port. Bring them up only while testing, and take
# them down (with their volumes) afterwards:
#
#   docker compose -f compose.test.yml up -d      # pull + start all five
#   npm test                                      # from the host
#   docker compose -f compose.test.yml down -v    # stop and discard the data
#
# The published ports are the ones tests/helpers/engines.ts already defaults to,
# so `npm test` needs no configuration. They are deliberately non-standard
# (13306 rather than 3306) to avoid colliding with an engine you run for
# something else — this machine already has Postgres on 5432 and Redis on 6379.
#
# Same directory, so the compose project name is `database-admin` — the same one
# compose.yml uses. That is what puts these engines on the `database-admin_dbadmin`
# network, where the app container and the Playwright e2e container reach them by
# service name (§10.3: inside a container, `localhost` is that container).

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dbadmin
      MYSQL_DATABASE: sample
      MYSQL_USER: dbadmin
      MYSQL_PASSWORD: dbadmin
    command: --local-infile=1
    ports: ["127.0.0.1:13306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./tests/fixtures/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdbadmin"]
      interval: 5s
      retries: 20
    networks: [dbadmin]

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: dbadmin
      MARIADB_DATABASE: sample
      MARIADB_USER: dbadmin
      MARIADB_PASSWORD: dbadmin
    ports: ["127.0.0.1:13307:3306"]
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    networks: [dbadmin]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dbadmin
      POSTGRES_USER: dbadmin
      POSTGRES_DB: sample
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./tests/fixtures/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d sample"]
      interval: 5s
      retries: 20
    networks: [dbadmin]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:16379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks: [dbadmin]

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: dbadmin
      MONGO_INITDB_ROOT_PASSWORD: dbadmin
    ports: ["127.0.0.1:17017:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20
    networks: [dbadmin]

volumes:
  mysql-data:
  mariadb-data:
  postgres-data:
  redis-data:
  mongo-data:

networks:
  dbadmin:
    driver: bridge
